<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 110" role="img" aria-label="Il Punto Antenna Elettronica">
  <!-- Antennista stilizzato: pelle rosa, maglia rossa, pantaloni azzurri -->
  <g>
    <!-- palo antenna inclinato -->
    <line x1="18" y1="88" x2="82" y2="12" stroke="#3a3a3a" stroke-width="2.6" stroke-linecap="round"/>
    <!-- boom con elementi Yagi in alto -->
    <line x1="46" y1="22" x2="96" y2="34" stroke="#3a3a3a" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="52" y1="14" x2="48" y2="32" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="16" x2="58" y2="34" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="19" x2="68" y2="37" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="21" x2="78" y2="39" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="24" x2="88" y2="42" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
    <!-- testa -->
    <circle cx="30" cy="38" r="8" fill="#f2a29b"/>
    <!-- braccia verso il palo -->
    <path d="M33 48 L52 40" stroke="#f2a29b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M31 54 L48 50" stroke="#f2a29b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- busto: maglia rossa -->
    <path d="M23 46 Q19 58 23 66 L38 64 Q41 54 35 47 Z" fill="#ed1c24"/>
    <!-- gambe: pantaloni azzurri, in tensione all'indietro -->
    <path d="M25 65 Q20 76 14 86 L20 89 Q27 78 31 68 Z" fill="#62c4e6"/>
    <path d="M32 66 Q34 78 33 88 L39 88 Q40 76 38 66 Z" fill="#62c4e6"/>
  </g>
  <!-- Scritta principale -->
  <text x="104" y="66" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="58" fill="#2e3192" textLength="556" lengthAdjust="spacingAndGlyphs">Il Punto Antenna</text>
  <!-- Barra rossa Elettronica -->
  <rect x="140" y="78" width="536" height="21" fill="#ed1c24"/>
  <text x="408" y="93.5" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="2">Elettronica</text>
</svg>
