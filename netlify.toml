# Configurazione Netlify – Il Punto Antenna Elettronica
# Sito statico. Prima di pubblicare, `scripts/genera.py` riscrive i blocchi
# delle pagine che dipendono dai file in `dati/` (recensioni e cataloghi).
# Le pagine restano HTML puro: la build non genera codice lato client.

[build]
  publish = "."
  command = "python3 scripts/genera.py"

# Sicurezza di base (aiutano anche il punteggio qualità del sito)
# Cache disattivata: ogni modifica pubblicata è visibile all'istante.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Il pannello non deve finire nei motori di ricerca né in un iframe.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

# Netlify serve ogni pagina anche senza estensione, e Google ha finito per
# indicizzare entrambe le forme dello stesso indirizzo. I tag canonical
# indicano la forma con .html: questi reindirizzamenti fanno dire al server
# la stessa cosa, così i due indirizzi si fondono in uno solo.

[[redirects]]
  from = "/antennista-lamezia-terme"
  to = "/antennista-lamezia-terme.html"
  status = 301
  force = true

[[redirects]]
  from = "/contatti"
  to = "/contatti.html"
  status = 301
  force = true

