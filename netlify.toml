# Il pannello appuntamenti vive in una cartella: /appuntamenti deve portare
# alla stessa pagina di /appuntamenti/, senza un giro di reindirizzamento.
# Le chiamate a /api/* le instrada la funzione da sé (vedi `config.path` in
# netlify/functions/api.mjs), quindi qui non serve nessuna regola.
[[redirects]]
  from = "/appuntamenti"
  to = "/appuntamenti/index.html"
  status = 200
